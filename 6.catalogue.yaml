- name: setup catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: disable default nodejs 
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: create dotmart system user 
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      system: true
      shell: /sbin/nologin
      home: /app

  - name: Create app directory 
    ansible.builtin.file:
      path: /app
      state: directory

  - name: Download catalogue application 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip

  - name: extract catalogue zip application 
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies 
    community.general.npm:
      path: /app

  - name: copy catalogue service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongo client
    ansible.builtin.package:
      name: mongodb-mongosh
      state: present

  # - name: connect to mongodb catalogue
  #   ansible.builtin.command: mongosh mongodb.dso86s.xyz --quiet --eval "db.getMongo().getDBNames().indexOf('catalogue')"
  #   register: catalogue_output

  # - name: evaluate catalogue database
  #   community.mongodb.mongodb_shell:
  #     login_host: mongodb.dso86s.xyz
  #     eval: db.getMongo().getDBNames().indexOf('catalogue')
  #   register: catalogue_output

  - name: Check if catalogue database exists
    ansible.builtin.command:
      cmd: >
        mongosh mongodb.dso86s.xyz --quiet --eval
        "db.getMongo().getDBNames().indexOf('catalogue')"
    register: catalogue_output

  - name: print catalogue output
    ansible.builtin.debug:
      # msg: "{{ catalogue_output }}" # This can be printed entire info
      var: catalogue_output.stdout # Can be printed stdout error only 

  - name: Load catalogue schema
    ansible.builtin.shell: |
      mongosh mongodb.dso86s.xyz </app/db/master-data.js
    when: catalogue_output.stdout == "-1"